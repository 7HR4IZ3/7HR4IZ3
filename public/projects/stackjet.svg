<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#111" stroke-opacity=".08"/></pattern></defs>
  <rect width="1200" height="720" fill="#f7f1e1"/><rect width="1200" height="720" fill="url(#grid)"/>
  <rect x="34" y="34" width="625" height="652" fill="#111"/><rect x="26" y="26" width="625" height="652" fill="#fff9ec" stroke="#111" stroke-width="3"/>
  <text x="56" y="72" fill="#111" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">REMOTE STORAGE CONTROL</text>
  <text x="56" y="142" fill="#111" font-family="Impact,Arial Black,sans-serif" font-size="66" font-weight="900">PUSH FILES STRAIGHT</text><text x="56" y="208" fill="#111" font-family="Impact,Arial Black,sans-serif" font-size="66" font-weight="900">FROM A URL INTO</text><text x="56" y="274" fill="#111" font-family="Impact,Arial Black,sans-serif" font-size="66" font-weight="900">CLOUD STORAGE.</text>
  <text x="56" y="330" fill="#49443c" font-family="Arial,sans-serif" font-size="18">Queue a remote file, resolve the source, and stream it into</text><text x="56" y="358" fill="#49443c" font-family="Arial,sans-serif" font-size="18">the selected provider without downloading it locally.</text>
  <rect x="60" y="414" width="170" height="54" fill="#111"/><rect x="54" y="408" width="170" height="54" rx="6" fill="#ff5b3d" stroke="#111" stroke-width="3"/><text x="139" y="442" text-anchor="middle" fill="#111" font-family="Arial,sans-serif" font-size="16" font-weight="700">CONNECT STORAGE</text>
  <rect x="56" y="536" width="92" height="42" fill="#8fe18a" stroke="#111" stroke-width="3"/><text x="102" y="563" text-anchor="middle" fill="#111" font-family="ui-monospace,monospace" font-size="15" font-weight="700">URL</text><path d="M148 557h110" stroke="#111" stroke-width="3"/><rect x="258" y="536" width="92" height="42" fill="#8fe18a" stroke="#111" stroke-width="3"/><text x="304" y="563" text-anchor="middle" fill="#111" font-family="ui-monospace,monospace" font-size="15" font-weight="700">JOB</text><path d="M350 557h110" stroke="#111" stroke-width="3"/><rect x="460" y="536" width="106" height="42" fill="#8fe18a" stroke="#111" stroke-width="3"/><text x="513" y="563" text-anchor="middle" fill="#111" font-family="ui-monospace,monospace" font-size="15" font-weight="700">VAULT</text>
  <g transform="translate(690 26)"><rect x="8" y="8" width="476" height="210" fill="#111"/><rect width="476" height="210" fill="#ffb19f" stroke="#111" stroke-width="3"/><text x="24" y="38" fill="#111" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CURRENT LIVE ROUTE</text><text x="24" y="82" fill="#111" font-family="Impact,Arial Black,sans-serif" font-size="30">URL UPLOAD TO GOOGLE DRIVE</text><text x="24" y="124" fill="#49443c" font-family="Arial,sans-serif" font-size="16">Background processing with signed source headers</text><text x="24" y="150" fill="#49443c" font-family="Arial,sans-serif" font-size="16">and serverless-safe orchestration.</text></g>
  <g font-family="Arial,sans-serif"><g transform="translate(690 264)"><rect x="6" y="6" width="224" height="184" fill="#111"/><rect width="224" height="184" fill="#fff9ec" stroke="#111" stroke-width="3"/><text x="18" y="43" fill="#111" font-family="Impact,Arial Black,sans-serif" font-size="23">PLATFORM AUTH</text><text x="18" y="83" fill="#49443c" font-size="15">OAuth signs users into</text><text x="18" y="106" fill="#49443c" font-size="15">the platform.</text></g><g transform="translate(946 264)"><rect x="6" y="6" width="224" height="184" fill="#111"/><rect width="224" height="184" fill="#fff9ec" stroke="#111" stroke-width="3"/><text x="18" y="43" fill="#111" font-family="Impact,Arial Black,sans-serif" font-size="23">DRIVE ACCESS</text><text x="18" y="83" fill="#49443c" font-size="15">Separate consent grants</text><text x="18" y="106" fill="#49443c" font-size="15">upload access.</text></g><g transform="translate(690 482)"><rect x="6" y="6" width="224" height="184" fill="#111"/><rect width="224" height="184" fill="#fff9ec" stroke="#111" stroke-width="3"/><text x="18" y="43" fill="#111" font-family="Impact,Arial Black,sans-serif" font-size="23">PROVIDER SHELL</text><text x="18" y="83" fill="#49443c" font-size="15">Multiple storage adapters</text><text x="18" y="106" fill="#49443c" font-size="15">share one surface.</text></g><g transform="translate(946 482)"><rect x="6" y="6" width="224" height="184" fill="#111"/><rect width="224" height="184" fill="#fff9ec" stroke="#111" stroke-width="3"/><text x="18" y="43" fill="#111" font-family="Impact,Arial Black,sans-serif" font-size="23">JOB CONTROL</text><text x="18" y="83" fill="#49443c" font-size="15">Uploads survive beyond</text><text x="18" y="106" fill="#49443c" font-size="15">one request.</text></g></g>
</svg>
